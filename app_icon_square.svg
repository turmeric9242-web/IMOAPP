<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Inverted corner-to-corner gradient: Blue at top-left corner to Gold at bottom-right corner -->
    <linearGradient id="cornerBorderGradientSquareFlipped" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002171" />     <!-- Deep royal blue at top-left corner -->
      <stop offset="15%" stop-color="#0D47A1" />
      <stop offset="50%" stop-color="#2E86C1" />
      <stop offset="75%" stop-color="#F5B041" />
      <stop offset="100%" stop-color="#FFD700" />   <!-- Gold at bottom-right corner -->
    </linearGradient>
  </defs>

  <!-- Base white background -->
  <rect width="512" height="512" fill="#FFFFFF" />

  <!-- Square frame border with blue-to-gold corner gradient -->
  <rect 
    x="10" 
    y="10" 
    width="492" 
    height="492" 
    fill="none" 
    stroke="url(#cornerBorderGradientSquareFlipped)" 
    stroke-width="20" />

  <!-- Centered blue text -->
  <text 
    x="50%" 
    y="53%" 
    text-anchor="middle" 
    dominant-baseline="central" 
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-size="160" 
    font-weight="900" 
    letter-spacing="4" 
    fill="#1565C0">IMO</text>
</svg>
